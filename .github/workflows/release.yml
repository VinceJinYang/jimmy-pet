name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build.sh

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent JimmyPet.app JimmyPet.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JimmyPet
          path: JimmyPet.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: JimmyPet.zip
          generate_release_notes: true
